<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="style.css">
    <title>diagnostic</title>
</head>
<body>
   <div class="main-title">📊 Hardware Diagnostic</div>
<div class="subtitle">Pemantauan Metrik Komputer Secara Langsung</div>

<div style="display: flex; gap: 20px; margin-bottom: 25px;">
    <div class="metric-card" style="flex: 1;">
        <div class="metric-icon">⚡</div>
        <div class="metric-title">CPU USAGE</div>
        <div class="metric-value">{cpu_val}</div>
    </div>
    <div class="metric-card" style="flex: 1;">
        <div class="metric-icon">🧠</div>
        <div class="metric-title">RAM USAGE</div>
        <div class="metric-value">{ram_val}</div>
    </div>
    <div class="metric-card" style="flex: 1;">
        <div class="metric-icon">💾</div>
        <div class="metric-title">DISK USAGE</div>
        <div class="metric-value">{disk_val}</div>
    </div>
</div>
</body>
</html>
